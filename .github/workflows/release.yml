name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate generated compatibility snapshot
        run: python tools/freeze_generated_compatibility.py --check

      - name: Check release tag
        if: github.event_name == 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as file:
              package_version = tomllib.load(file)["project"]["version"]
          expected_tag = f"v{package_version}"
          if os.environ["REF_NAME"] != expected_tag:
              raise SystemExit(
                  f"Release tag must be {expected_tag}, got {os.environ['REF_NAME']}"
              )
          print(f"Building msgspec-flatbuffers {package_version}")
          PY

  wheels:
    name: Wheel (${{ matrix.target }}, Python ${{ matrix.python }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14t"]
        platform:
          - linux-x86_64
          - linux-aarch64
          - macos-x86_64
          - macos-aarch64
          - windows-x86_64
        exclude:
          - python: "3.14t"
            platform: windows-x86_64
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2_17"
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_17"
          - platform: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: "off"
          - platform: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            manylinux: "off"
          - platform: windows-x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            manylinux: "off"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Build wheel
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          maturin-version: v1.11.5
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --compatibility pypi --out dist

      - name: Smoke-test wheel
        run: >-
          python -c "import glob, subprocess, sys;
          wheel, = glob.glob('dist/*.whl');
          subprocess.check_call([sys.executable, '-m', 'pip', 'install',
          '--force-reinstall', wheel])"

      - name: Verify free-threaded execution remains enabled
        if: endsWith(matrix.python, 't')
        run: >-
          python -c "import sys; import msgspec_flatbuffers;
          assert not sys._is_gil_enabled()"

      - name: Test generated compatibility snapshots
        run: |
          python -m pip install "pytest>=8"
          python -m pytest -q tests/test_generated_compatibility.py

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  sdist:
    name: Source distribution
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build source distribution
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          maturin-version: v1.11.5
          command: sdist
          args: --locked --out dist

      - name: Upload source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  github-release:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # Download artifacts built by this workflow.
      contents: write # Attach distributions to the GitHub Release.

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag

  pypi:
    name: Publish to PyPI
    if: github.event_name == 'push'
    needs: github-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/msgspec-flatbuffers
    permissions:
      actions: read # Download artifacts built by this workflow.
      id-token: write # Authenticate to PyPI through Trusted Publishing.

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
