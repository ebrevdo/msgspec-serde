[package]
name = "msgspec-serde-native"
version = "0.1.3"
edition = "2024"
license = "Apache-2.0"
description = "Rust serialization backend for msgspec-serde"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
flatbuffers = "25.12.19"
# ABI3T support: https://github.com/PyO3/rust-numpy/pull/556
numpy = { git = "https://github.com/PyO3/rust-numpy", rev = "9df402373716a60f0e7825b6043568abe4e63b46" }
pyo3 = { version = "0.29", features = ["abi3-py312", "abi3t-py315"] }
rmp = "0.8"
rmp-serde = "1.3"
rmpv = { version = "1.3", features = ["with-serde"] }
serde = { version = "1", features = ["derive"] }
sonic-rs = "0.5"
