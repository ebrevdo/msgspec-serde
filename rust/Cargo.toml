[package]
name = "msgspec-flatbuffers-native"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Rust serialization backend for msgspec-flatbuffers"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
flatbuffers = "25.12.19"
pyo3 = { version = "0.29", features = ["abi3-py312"] }
rmp-serde = "1.3"
rmpv = { version = "1.3", features = ["with-serde"] }
serde = { version = "1", features = ["derive"] }
